[package]
name = "comfy-bridge-launcher"
version = "0.1.0"
edition = "2021"
description = "ComfyBridge 桌面启动器：内置后端服务与原生 WebView2 窗口"
publish = false

[[bin]]
name = "comfy-bridge"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
