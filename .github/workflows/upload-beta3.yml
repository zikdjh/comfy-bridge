name: Upload beta.3 bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.0-beta.3
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
      - name: Build desktop bundle
        shell: pwsh
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:embed
      - name: Build wheel
        shell: pwsh
        working-directory: backend
        run: |
          uv sync --frozen --python 3.14
          uv run python scripts/build_package.py --no-frontend
      - name: Assemble bundle
        shell: pwsh
        working-directory: backend
        run: uv run python scripts/build_rust_package.py --skip-wheel --no-frontend
      - name: Upload release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.1.0-beta.3 backend/dist/ComfyBridge-0.1.0-win64.zip --clobber
