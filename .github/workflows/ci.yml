name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  # 后端：ruff（存量已清零，任何违规即拦截）+ pytest 全量（含兼容矩阵 40 项）
  backend-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 同步依赖
        run: uv sync --frozen
      - name: Ruff（存量已清零，任何违规即失败）
        shell: pwsh
        run: |
          uv run ruff check . --output-format=concise 2>&1 | Tee-Object -Variable out | Out-Host
          $count = ($out | Where-Object { $_ -match '\.py:\d+:\d+: [A-Z]+\d+' }).Count
          Write-Host "ruff 违规 $count（要求 0）"
          # ruff 自身异常（无法解析配置等）退出码 >1，必须先显式拦截
          if ($LASTEXITCODE -gt 1) { Write-Host "::error::ruff 自身异常 exit=$LASTEXITCODE"; exit $LASTEXITCODE }
          # 存量已清零，之后任何新增违规都直接失败（P3-1 闭环）
          if ($count -gt 0) { Write-Host "::error::存在 ruff 违规 $count 条"; exit 1 }
          exit 0
      - name: Pytest
        run: uv run pytest -q
      - name: Mypy（存量已清零，任何错误即失败）
        run: uv run mypy

  # 前端全栈 e2e：构建嵌入产物 → webServer 拉起隔离后端（CB_CONFIG_DIR 离线空态）
  # → Playwright（系统 Edge）跑核心链路
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
      - name: 构建嵌入前端
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:embed
      - name: 同步后端依赖
        working-directory: backend
        run: uv sync --frozen
      - name: 运行 Playwright e2e
        working-directory: frontend
        run: pnpm exec playwright test
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: frontend/test-results/
          retention-days: 7
