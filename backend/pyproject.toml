[project]
name = "comfy-bridge-backend"
version = "0.1.0"
description = "ComfyBridge - 本地 ComfyUI 与 Modal 云端 GPU 的桥接器（后端）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "modal>=0.70",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "live: 需要真实 Modal / 本地 ComfyUI 环境的联调用例",
]
