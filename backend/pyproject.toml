[project]
name = "comfy-bridge-backend"
version = "0.1.0"
description = "ComfyBridge - 本地 ComfyUI 与 Modal 云端 GPU 的桥接器（后端）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=12",
    "pydantic>=2.7",
    # modal 仅作子进程调用（CLI：volume/app/container；账单：子进程内用其 gRPC 客户端查 WorkspaceBillingSummary），
    # 后端主进程不 import 其 SDK（副作用重：事件循环策略、日志钩子）
    "modal>=0.70",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "live: 需要真实 Modal / 本地 ComfyUI 环境的联调用例",
]
